naftiko: 1.0.0-alpha2
info:
  label: Google Cloud Talent Solution API — Tenants
  description: 'Google Cloud Talent Solution API — Tenants. 4 operations. Lead operation: Google Cloud Talent Solution List
    tenants. Self-contained Naftiko capability covering one Google Cloud Talent Solution business surface.'
  tags:
  - Google Cloud Talent Solution
  - Tenants
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GOOGLE_CLOUD_TALENT_SOLUTION_API_KEY: GOOGLE_CLOUD_TALENT_SOLUTION_API_KEY
capability:
  consumes:
  - type: http
    namespace: openapi-tenants
    baseUri: https://jobs.googleapis.com/v4
    description: Google Cloud Talent Solution API — Tenants business capability. Self-contained, no shared references.
    resources:
    - name: projects-projectId-tenants
      path: /projects/{projectId}/tenants
      operations:
      - name: listtenants
        method: GET
        description: Google Cloud Talent Solution List tenants
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: projectId
          in: path
          type: string
          required: true
      - name: createtenant
        method: POST
        description: Google Cloud Talent Solution Create a tenant
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: projectId
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: projects-projectId-tenants-tenantId
      path: /projects/{projectId}/tenants/{tenantId}
      operations:
      - name: gettenant
        method: GET
        description: Google Cloud Talent Solution Get a tenant
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: projectId
          in: path
          type: string
          required: true
        - name: tenantId
          in: path
          type: string
          required: true
      - name: deletetenant
        method: DELETE
        description: Google Cloud Talent Solution Delete a tenant
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: projectId
          in: path
          type: string
          required: true
        - name: tenantId
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.GOOGLE_CLOUD_TALENT_SOLUTION_API_KEY}}'
  exposes:
  - type: rest
    namespace: openapi-tenants-rest
    port: 8080
    description: REST adapter for Google Cloud Talent Solution API — Tenants. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/projects/{projectid}/tenants
      name: projects-projectid-tenants
      description: REST surface for projects-projectId-tenants.
      operations:
      - method: GET
        name: listtenants
        description: Google Cloud Talent Solution List tenants
        call: openapi-tenants.listtenants
        with:
          projectId: rest.projectId
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createtenant
        description: Google Cloud Talent Solution Create a tenant
        call: openapi-tenants.createtenant
        with:
          projectId: rest.projectId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/projects/{projectid}/tenants/{tenantid}
      name: projects-projectid-tenants-tenantid
      description: REST surface for projects-projectId-tenants-tenantId.
      operations:
      - method: GET
        name: gettenant
        description: Google Cloud Talent Solution Get a tenant
        call: openapi-tenants.gettenant
        with:
          projectId: rest.projectId
          tenantId: rest.tenantId
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletetenant
        description: Google Cloud Talent Solution Delete a tenant
        call: openapi-tenants.deletetenant
        with:
          projectId: rest.projectId
          tenantId: rest.tenantId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: openapi-tenants-mcp
    port: 9090
    transport: http
    description: MCP adapter for Google Cloud Talent Solution API — Tenants. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: google-cloud-talent-solution-list
      description: Google Cloud Talent Solution List tenants
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: openapi-tenants.listtenants
      with:
        projectId: tools.projectId
      outputParameters:
      - type: object
        mapping: $.
    - name: google-cloud-talent-solution-create
      description: Google Cloud Talent Solution Create a tenant
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: openapi-tenants.createtenant
      with:
        projectId: tools.projectId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: google-cloud-talent-solution-get
      description: Google Cloud Talent Solution Get a tenant
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: openapi-tenants.gettenant
      with:
        projectId: tools.projectId
        tenantId: tools.tenantId
      outputParameters:
      - type: object
        mapping: $.
    - name: google-cloud-talent-solution-delete
      description: Google Cloud Talent Solution Delete a tenant
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: openapi-tenants.deletetenant
      with:
        projectId: tools.projectId
        tenantId: tools.tenantId
      outputParameters:
      - type: object
        mapping: $.
