name: Google Cloud Talent Solution
description: >-
  Google Cloud Talent Solution provides a job search and talent acquisition platform that leverages machine learning to
  match job seekers with relevant opportunities. It offers job posting management, candidate profile search, and
  intelligent job recommendations for enterprises and job boards.
